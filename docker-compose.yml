services:
  postgres:
    image: postgres:16-alpine
    container_name: logixmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logixmart
      POSTGRES_PASSWORD: Password@123
      POSTGRES_DB: logixmart
    ports:
      # 5433 avoids clash when another Postgres already uses host 5432
      - "5433:5432"
    volumes:
      - logixmart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logixmart -d logixmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: logixmart-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://logixmart:Password%40123@postgres:5432/logixmart?schema=public
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
      # Host path ./uploads is mounted at /app/uploads so blog/resume files persist & serve
      UPLOAD_DIR: uploads
      JWT_SECRET: ${JWT_SECRET:?Set a strong unique JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a strong unique JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong unique ADMIN_PASSWORD}
    volumes:
      # Persist and serve local upload files inside the container
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  logixmart_pgdata:
